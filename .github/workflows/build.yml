# Builds the checkout image for one commit without deploying it.
name: build
run-name: build ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to build.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: 788198741820.dkr.ecr.us-west-2.amazonaws.com/otel-demo-ai-deploy-checkout

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::788198741820:role/otel-demo-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Check for an existing image
        id: image
        run: |
          if aws ecr describe-images --repository-name otel-demo-ai-deploy-checkout --image-ids imageTag="${{ inputs.sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ECR
        if: steps.image.outputs.exists == 'false'
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"

      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.image.outputs.exists == 'false'

      - uses: docker/build-push-action@v7.4.0
        if: steps.image.outputs.exists == 'false'
        with:
          context: .
          file: src/checkout/Dockerfile
          push: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ inputs.sha }}
          cache-from: type=gha,scope=checkout
          cache-to: type=gha,mode=max,scope=checkout
